version = 1

# Vendor-level provider examples ("LLM Provider Config"). One [[providers]]
# block per vendor: a single api_key plus one [providers.variants.<protocol>]
# entry per wire protocol the vendor serves. Agents resolve their own variant:
#   claude -> anthropic, codex -> openai_responses (falls back to openai_chat),
#   opencode -> openai_chat.
# `models` lists the vendor's models — every model shares the same API key.

[[providers]]
slug = "glm"
name = "GLM (Volcengine Ark)"
api_key = "" # fill via CLI/TUI/Web, keep out of shared files
default_model = "glm-5.2"
models = ["glm-5.2", "glm-5.3"]
active = true

[providers.variants.anthropic]
base_url = "https://ark.cn-beijing.volces.com/api/plan"
endpoints = { messages = "/v1/messages", models = "/v1/models" }
capabilities = { claude_extra_env = { API_TIMEOUT_MS = "3000000", CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = "1" } }

[providers.variants.openai_chat]
base_url = "https://ark.cn-beijing.volces.com/api/v3"
endpoints = { chat_completions = "/chat/completions", models = "/models" }

[[providers]]
slug = "minimax"
name = "MiniMax"
api_key = ""
default_model = "MiniMax-M3"
models = ["MiniMax-M3"]
active = true

[providers.variants.anthropic]
base_url = "https://api.minimaxi.com/anthropic"
endpoints = { messages = "/v1/messages", models = "/v1/models" }

[providers.variants.openai_responses]
base_url = "https://api.minimaxi.com/v1"
endpoints = { responses = "/responses", models = "/models" }
capabilities = { codex_auth_mode = "experimental_bearer_token", codex_model_context_window = 512000 }

[providers.variants.openai_chat]
base_url = "https://api.minimaxi.com/v1"
endpoints = { chat_completions = "/chat/completions", models = "/models" }

# Profiles are OPTIONAL Agent + Provider bindings. Keep them minimal: only
# carry per-agent overrides (model, args, env/config overrides, default flag).
# Do NOT restate the provider's default_model here - the adapter falls back to
# the provider default when a profile omits model.

[[profiles]]
slug = "claude-glm"
name = "Claude Code with GLM"
agent = "claude"
provider = "glm"
is_default = false

[[profiles]]
slug = "codex-glm53"
name = "Codex with GLM 5.3"
agent = "codex"
provider = "glm"
model = "glm-5.3"
is_default = false
