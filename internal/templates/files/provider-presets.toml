# Vendor-level provider presets ("LLM Provider Config").
#
# One [[presets]] block per vendor: a single API key plus one
# [[presets.variants]] entry per wire protocol the vendor serves. Agents
# (claude code / codex / opencode) pick the matching variant at launch:
#   claude   -> anthropic
#   codex    -> openai_responses (falls back to openai_chat)
#   opencode -> openai_chat
#
# `models` is the vendor's model list — add new models here (or via
# `aisw provider model add`) and they share the same API key everywhere.

[[presets]]
slug = "glm"
name = "GLM (Volcengine Ark)"
default_model = "glm-5.2"
models = ["glm-5.2", "glm-5.3"]

  [[presets.variants]]
  protocol = "anthropic"
  base_url = "https://ark.cn-beijing.volces.com/api/plan"
  endpoints = { messages = "/v1/messages", models = "/v1/models" }
  # The plan gateway needs a long timeout and disables non-essential
  # traffic, matching the working Claude Code settings for GLM on Ark.
  capabilities = { claude_extra_env = { API_TIMEOUT_MS = "3000000", CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = "1" } }

  [[presets.variants]]
  protocol = "openai_chat"
  base_url = "https://ark.cn-beijing.volces.com/api/v3"
  endpoints = { chat_completions = "/chat/completions", models = "/models" }

[[presets]]
slug = "minimax"
name = "MiniMax"
default_model = "MiniMax-M3"
models = ["MiniMax-M3"]

  [[presets.variants]]
  protocol = "anthropic"
  base_url = "https://api.minimaxi.com/anthropic"
  endpoints = { messages = "/v1/messages", models = "/v1/models" }
  capabilities = { claude_extra_env = { API_TIMEOUT_MS = "3000000", CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = "1", CLAUDE_CODE_AUTO_COMPACT_WINDOW = "512000" } }

  [[presets.variants]]
  protocol = "openai_responses"
  base_url = "https://api.minimaxi.com/v1"
  endpoints = { responses = "/responses", models = "/models" }
  capabilities = { codex_auth_mode = "experimental_bearer_token", codex_model_context_window = 512000 }

  [[presets.variants]]
  protocol = "openai_chat"
  base_url = "https://api.minimaxi.com/v1"
  endpoints = { chat_completions = "/chat/completions", models = "/models" }

