# Taskfile for innate-aiswitcher.
#
# 跨平台支持: macOS, Linux, Windows (PowerShell)
# 需要: Go 1.26+, Task (https://taskfile.dev)
#
# 快速开始:
#   task build          # 构建前端 + 单体二进制到 bin/ 目录
#   task serve          # 启动 API 服务器 + Web UI
#   task docs:dev       # 启动 docmd 文档站本地预览
#   task docs:build     # 构建静态文档到 site/
#   task run            # 启动交互式 TUI
#   task dev            # 构建并启动服务器

version: "3"

vars:
  BIN_DIR: bin
  BINARY: aisw
  BIN_EXT: '{{if eq OS "windows"}}.exe{{end}}'
  CLI_PKG: ./cmd/aisw
  PKGS: "./cmd/aisw ./cmd/mock-provider ./internal/... ./migrations"
  HTTP_ADDR: 127.0.0.1:8090

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ── Build & Install ──────────────────────────────────────

  build:
    desc: Build the web frontend then the aisw binary (full single-binary app)
    deps: [web:build]
    cmds:
      - go build -o "{{.BIN_DIR}}/{{.BINARY}}{{.BIN_EXT}}" {{.CLI_PKG}}
    generates:
      - "{{.BIN_DIR}}/{{.BINARY}}"

  web:install:
    desc: Install web frontend dependencies (web/)
    dir: web
    cmds:
      - npm install

  web:dev:
    desc: Vite dev server with /api proxied to 127.0.0.1:8090 (run task serve alongside)
    dir: web
    cmds:
      - npm run dev

  web:build:
    desc: Build the web frontend and sync it into internal/webui/dist for go:embed
    deps: [web:install]
    cmds:
      - task: web:build:vite
      - cmd: rm -rf internal/webui/dist && mkdir -p internal/webui/dist && cp -R web/dist/. internal/webui/dist/

  web:build:vite:
    desc: Run the Vite production build inside web/
    dir: web
    cmds:
      - npm run build

  build:windows:
    desc: Cross-compile for Windows amd64
    cmds:
      - go build -o "{{.BIN_DIR}}/{{.BINARY}}_windows_amd64.exe" {{.CLI_PKG}}
    env:
      GOOS: windows
      GOARCH: amd64

  build:linux:
    desc: Cross-compile for Linux amd64
    cmds:
      - go build -o "{{.BIN_DIR}}/{{.BINARY}}_linux_amd64" {{.CLI_PKG}}
    env:
      GOOS: linux
      GOARCH: amd64

  install:
    desc: Build and copy binary to ~/.local/bin
    deps:
      - build
    cmds:
      - cmd: pwsh -Command "New-Item -ItemType Directory -Force -Path $env:USERPROFILE\.local\bin | Out-Null; Copy-Item '{{.BIN_DIR}}\{{.BINARY}}{{.BIN_EXT}}' $env:USERPROFILE\.local\bin\ -Force"
        platforms: [windows]
      - cmd: mkdir -p ~/.local/bin && cp "{{.BIN_DIR}}/{{.BINARY}}" ~/.local/bin/
        platforms: [linux, darwin]

  # ── Run & Serve ──────────────────────────────────────────

  dev:
    desc: Build then start server (one-stop)
    deps:
      - build
    cmds:
      - '{{.BIN_DIR}}/{{.BINARY}}{{.BIN_EXT}} serve --http {{.HTTP_ADDR}}'

  serve:
    desc: Start API server + Web UI at http://{{.HTTP_ADDR}}
    cmds:
      - go run {{.CLI_PKG}} serve --http {{.HTTP_ADDR}}

  serve:verbose:
    desc: Start server with full PocketBase startup banner
    cmds:
      - go run {{.CLI_PKG}} serve --http {{.HTTP_ADDR}} --show-admin-banner

  run:
    desc: Launch the interactive TUI
    cmds:
      - go run {{.CLI_PKG}} {{.CLI_ARGS}}

  # ── Quality ──────────────────────────────────────────────

  fmt:
    desc: Format Go source files
    cmds:
      - gofmt -w main.go cmd/aisw internal migrations

  test:
    desc: Run unit tests
    cmds:
      - go test {{.PKGS}}

  vet:
    desc: Run go vet
    cmds:
      - go vet {{.PKGS}}

  compile:
    desc: Compile all packages (check for build errors)
    cmds:
      - go build {{.PKGS}}

  verify:
    desc: Format, vet, test, and build
    cmds:
      - task: fmt
      - task: vet
      - task: test
      - task: build
      - go mod verify

  # ── Data ─────────────────────────────────────────────────

  sync-db:
    desc: Copy repo data.db to ~/.innate-aiswitcher/pb_data/
    cmds:
      - cmd: pwsh -NoProfile -File scripts/sync-data-db.ps1
        platforms: [windows]
      - cmd: bash scripts/sync-data-db.sh
        platforms: [linux, darwin]

  # ── Cleanup ──────────────────────────────────────────────

  clean:
    desc: Remove build artifacts
    cmds:
      - cmd: pwsh -Command "Remove-Item -Recurse -Force bin\ -ErrorAction SilentlyContinue"
        platforms: [windows]
      - cmd: rm -rf bin
        platforms: [linux, darwin]

  # ── Documentation (docmd) ────────────────────────────────

  docs:dev:
    desc: Start docmd dev server for documentation site
    cmds:
      - npm run dev

  docs:build:
    desc: Build static documentation site to site/
    cmds:
      - npm run build
